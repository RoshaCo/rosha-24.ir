<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#faf3e6">
  <title>Gold Talent — گالری هنری روشا</title>

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

  <style>
    /* =========================================================
       استایل ۱ سایت — Neo Editorial (کرم + سبز + طلایی)
       صفحه اسکرول‌ناپذیر — همه‌چیز توی یه ویوپورت
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 10px;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #faf3e6;
      color: #154726;
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.6rem;
      direction: rtl;
      line-height: 1.5;

      background-image:
        radial-gradient(circle at 15% 15%, rgba(254, 178, 145, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 213, 80, 0.25) 0%, transparent 45%);
      background-attachment: fixed;

      /* جلوگیری از اسکرول روی موبایل */
      position: fixed;
      inset: 0;
    }

    /* =========================================================
       کانتینر اصلی
       ========================================================= */
    .wrap {
      max-width: 480px;
      width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.2rem, 3vh, 2rem);
      text-align: center;
    }

    /* =========================================================
       تیتر برند
       ========================================================= */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: clamp(6rem, 14vh, 8.5rem);
      height: clamp(6rem, 14vh, 8.5rem);
      border-radius: 50%;
      background: linear-gradient(180deg, #ffcaa6 0%, #feb291 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(3rem, 7vh, 4.2rem);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.7),
        0 6px 0 #d88a5e,
        0 12px 24px -6px rgba(21, 71, 38, 0.3),
        0 0 50px rgba(254, 178, 145, 0.6);
      animation: brandPulse 3s ease-in-out infinite;
    }

    @keyframes brandPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.7),
          0 6px 0 #d88a5e,
          0 12px 24px -6px rgba(21, 71, 38, 0.3),
          0 0 50px rgba(254, 178, 145, 0.6);
      }
      50% {
        transform: scale(1.06);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.7),
          0 6px 0 #d88a5e,
          0 12px 24px -6px rgba(21, 71, 38, 0.4),
          0 0 70px rgba(254, 178, 145, 0.85);
      }
    }

    .brand-title {
      font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(3.6rem, 9vh, 5.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #154726;
      text-shadow:
        0 2px 0 #ffffff,
        0 3px 0 #f5e8d4,
        0 6px 16px rgba(21, 71, 38, 0.15);
      direction: ltr;
    }

    .brand-title .gold {
      color: #c8862a;
    }

    /* =========================================================
       کادر راهنما
       ========================================================= */
    .hint-box {
      width: 100%;
      padding: clamp(1.4rem, 3vh, 2rem) clamp(1.2rem, 4vw, 1.8rem);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(250, 243, 230, 0.75) 100%
      );
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 1.6rem;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 1),
        0 6px 0 #f0d5b8,
        0 14px 28px -8px rgba(21, 71, 38, 0.2);
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2vh, 1.4rem);
    }

    .hint-title {
      font-size: clamp(1.7rem, 4.5vw, 2.2rem);
      font-weight: 800;
      color: #6b1212;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      line-height: 1.3;
    }

    .hint-title .icon {
      font-size: 1.15em;
      flex-shrink: 0;
    }

    .hint-text {
      font-size: clamp(1.5rem, 4vw, 1.8rem);
      font-weight: 500;
      line-height: 1.7;
      color: #154726;
      opacity: 0.9;
    }

    .hint-text strong {
      color: #c8862a;
      font-weight: 800;
    }

    /* =========================================================
       لینک سایت + کپی (زیر هم)
       ========================================================= */
    .url-stack {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
    }

    .url-text {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.6rem 1rem;
      background: #154726;
      color: #ffd550;
      border-radius: 1rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(1.6rem, 4.5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      direction: ltr;
      user-select: all;
      word-break: break-all;
      text-align: center;
      box-shadow:
        inset 0 3px 0 rgba(0, 0, 0, 0.3),
        inset 0 -2px 0 rgba(255, 255, 255, 0.08);
      text-shadow: 0 0 8px rgba(255, 213, 80, 0.4);
      min-height: 5.4rem;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      width: 100%;
      padding: 1.6rem 1rem;
      background: linear-gradient(180deg, #ffcaa6 0%, #feb291 100%);
      color: #154726;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 1rem;
      font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(1.6rem, 4.5vw, 2rem);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 5px 0 #d88a5e,
        0 10px 18px -4px rgba(21, 71, 38, 0.25);
      min-height: 5.4rem;
    }

    .copy-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 7px 0 #d88a5e,
        0 14px 24px -4px rgba(21, 71, 38, 0.3);
    }

    .copy-btn:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.7),
        0 2px 0 #d88a5e,
        0 4px 8px rgba(21, 71, 38, 0.2);
    }

    .copy-btn.copied {
      background: linear-gradient(180deg, #b8e08e 0%, #97c74b 100%);
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        0 5px 0 #4d7a1f,
        0 10px 18px -4px rgba(21, 71, 38, 0.3);
    }

    /* =========================================================
       دکمه ورود به سایت — بزرگ و چشمگیر
       ========================================================= */
    .enter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      padding: clamp(1.8rem, 4vh, 2.6rem) 1.6rem;
      background: linear-gradient(180deg, #c73e3e 0%, #8b2525 100%);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 1.4rem;
      font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(2rem, 6vw, 2.6rem);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.25),
        inset 0 -3px 0 rgba(0, 0, 0, 0.25),
        0 6px 0 #5c1515,
        0 12px 24px -4px rgba(199, 62, 62, 0.5),
        0 0 40px rgba(199, 62, 62, 0.35);
      transition: all 0.15s cubic-bezier(0.19, 1, 0.22, 1);
      transform: translateY(0);
      animation: enterGlow 2.5s ease-in-out infinite;
    }

    @keyframes enterGlow {
      0%, 100% {
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.25),
          inset 0 -3px 0 rgba(0, 0, 0, 0.25),
          0 6px 0 #5c1515,
          0 12px 24px -4px rgba(199, 62, 62, 0.5),
          0 0 40px rgba(199, 62, 62, 0.35);
      }
      50% {
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.3),
          inset 0 -3px 0 rgba(0, 0, 0, 0.25),
          0 6px 0 #5c1515,
          0 12px 24px -4px rgba(199, 62, 62, 0.6),
          0 0 70px rgba(199, 62, 62, 0.6);
      }
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -3px 0 rgba(0, 0, 0, 0.25),
        0 8px 0 #5c1515,
        0 16px 32px -4px rgba(199, 62, 62, 0.6),
        0 0 60px rgba(199, 62, 62, 0.6);
    }

    .enter-btn:active {
      transform: translateY(4px);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.25),
        inset 0 -3px 0 rgba(0, 0, 0, 0.25),
        0 2px 0 #5c1515,
        0 4px 8px rgba(199, 62, 62, 0.4);
    }

    .enter-btn .icon {
      font-size: 1.15em;
      line-height: 1;
    }

    /* =========================================================
       پاورقی
       ========================================================= */
    .footer-note {
      width: 100%;
      padding: clamp(1.2rem, 2.5vh, 1.6rem) clamp(1rem, 3vw, 1.4rem);
      background: rgba(255, 213, 80, 0.3);
      border: 2px dashed #d4a500;
      border-radius: 1.2rem;
      font-size: clamp(1.4rem, 3.8vw, 1.7rem);
      font-weight: 700;
      line-height: 1.7;
      color: #6b1212;
      text-align: center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0.8rem;
    }

    .footer-note .lock {
      font-size: 1.2em;
      line-height: 1.4;
      flex-shrink: 0;
    }

    /* =========================================================
       Toast
       ========================================================= */
    .toast {
      position: fixed;
      bottom: 2.4rem;
      left: 50%;
      transform: translateX(-50%) translateY(3rem);
      background: #154726;
      color: #ffd550;
      padding: 1.4rem 2.4rem;
      border-radius: 1.2rem;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      box-shadow:
        0 8px 24px rgba(21, 71, 38, 0.5),
        0 0 0 2px rgba(255, 213, 80, 0.7),
        0 0 30px rgba(255, 213, 80, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 9999;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================
       موبایل‌های کوچک (Samsung J3 و ...)
       ========================================================= */
    @media (max-height: 640px) {
      html { font-size: 8.5px; }
      .wrap { gap: 1rem; }
    }

    @media (max-height: 560px) {
      html { font-size: 7.5px; }
      .wrap { gap: 0.8rem; }
      .brand-icon { width: 5rem; height: 5rem; font-size: 2.6rem; }
    }
  </style>
</head>
<body>

  <div class="wrap">

    <!-- ===== برند ===== -->
    <div class="brand">
      <div class="brand-icon">🏆</div>
      <h1 class="brand-title">
        <span class="gold">Gold</span> Talent
      </h1>
    </div>

    <!-- ===== کادر راهنما + آدرس ===== -->
    <div class="hint-box">

      <div class="hint-title">
        <span class="icon">⚠️</span>
        <span>سایت در اینستاگرام باز نمی‌شود</span>
      </div>

      <div class="hint-text">
        آدرس زیر را کپی کنید و در مرورگر خود
        (<strong>Chrome</strong> یا <strong>Safari</strong>) باز کنید:
      </div>

      <div class="url-stack">
        <div class="url-text" id="urlText">rosha-24.ir/x7q</div>

        <button type="button" class="copy-btn" id="copyBtn">
          📋 کپی آدرس
        </button>
      </div>

    </div>

    <!-- ===== دکمه ورود ===== -->
    <a href="#" class="enter-btn" id="enterBtn">
      <span class="icon">🚪</span>
      <span>ورود به سایت</span>
    </a>

    <!-- ===== پاورقی ===== -->
    <div class="footer-note">
      <span class="lock">🔒</span>
      <span>
        سایت دارای نماد اعتماد الکترونیک است،
        بهتر است فیلترشکن خود را خاموش کنید
      </span>
    </div>

  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast">✅ آدرس کپی شد</div>

  <script>
  (function () {
    'use strict';

    var SITE_URL = 'https://rosha-24.ir/x7q';
    var URL_TEXT = 'rosha-24.ir/x7q';

    // ===== دکمه ورود =====
    var enterBtn = document.getElementById('enterBtn');
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /android/i.test(ua);

    var targetUrl;
    if (isIOS) {
      targetUrl = 'x-safari-' + SITE_URL;
    } else if (isAndroid) {
      targetUrl = 'intent://rosha-24.ir/x7q#Intent;scheme=https;end';
    } else {
      targetUrl = SITE_URL;
    }
    enterBtn.setAttribute('href', targetUrl);

    // ===== دکمه کپی =====
    var copyBtn = document.getElementById('copyBtn');
    var toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function () {
        toast.classList.remove('show');
      }, 1800);
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ آدرس کپی شد');
      } catch (e) {
        showToast('❌ خطا در کپی');
      }
      document.body.removeChild(ta);
    }

    copyBtn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(URL_TEXT).then(function () {
          showToast('✅ آدرس کپی شد');
          copyBtn.classList.add('copied');
          copyBtn.textContent = '✅ کپی شد';
          setTimeout(function () {
            copyBtn.classList.remove('copied');
            copyBtn.textContent = '📋 کپی آدرس';
          }, 1800);
        }).catch(function () {
          fallbackCopy(URL_TEXT);
        });
      } else {
        fallbackCopy(URL_TEXT);
      }
    });

  })();
  </script>

</body>
</html>
